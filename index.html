<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PacketLens — Packet Capture Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0f1113; --surface-1:#16191c; --surface-2:#1d2125; --surface-3:#252a2f; --border:#2c3238; --border-strong:#3a4148;
  --text-primary:#eceae6; --text-secondary:#b4b2ab; --text-muted:#878580;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
  --crit:#e66767; --high:#e8833a; --med:#d9a521; --low:#5fa8e8; --info:#8f8d87;
  --row-err:rgba(230,103,103,.13); --row-warn:rgba(217,165,33,.11); --row-dns:rgba(57,135,229,.09); --row-arp:rgba(144,133,233,.10); --row-ctl:rgba(255,255,255,.035); --row-icmp:rgba(25,158,112,.10);
  --sel:#2b5b94;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f2ef; --surface-1:#fcfcfb; --surface-2:#f4f3f0; --surface-3:#eae8e3; --border:#dedcd6; --border-strong:#c9c6be;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#73716b;
  --accent:#2a78d6; --accent-soft:rgba(42,120,214,.12);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300; --series-7:#6250d6; --series-8:#e34948;
  --crit:#c93534; --high:#c4571e; --med:#9a6c00; --low:#2a6fbf; --info:#73716b;
  --row-err:rgba(227,73,72,.12); --row-warn:rgba(237,161,0,.13); --row-dns:rgba(42,120,214,.07); --row-arp:rgba(98,80,214,.08); --row-ctl:rgba(0,0,0,.035); --row-icmp:rgba(27,175,122,.09);
  --sel:#b3cff2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text-primary);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
a{color:var(--accent)}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--surface-1);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;font-size:15px}
.brand svg{flex:none}
.brand small{font-weight:500;color:var(--text-muted);font-size:12px;margin-left:2px}
.fileinfo{color:var(--text-secondary);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fileinfo b{color:var(--text-primary);font-weight:600}
.btn{border:1px solid var(--border-strong);background:var(--surface-2);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px;border-radius:6px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--surface-1);overflow-x:auto;position:sticky;top:53px;z-index:19}
nav.tabs button{background:none;border:0;padding:10px 12px 9px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;font-weight:500;font-size:13.5px;white-space:nowrap}
nav.tabs button:hover{color:var(--text-primary)}
nav.tabs button.on{color:var(--text-primary);border-bottom-color:var(--accent)}
nav.tabs .count{font-size:11px;color:var(--text-muted);margin-left:5px;font-family:var(--mono)}
nav.tabs .count.alert{color:var(--crit);font-weight:600}
main{padding:18px;max-width:1500px;margin:0 auto}
main.full{max-width:none;padding:0}
/* ---------- dropzone ---------- */
.drop{margin:7vh auto 0;max-width:760px;border:1.5px dashed var(--border-strong);border-radius:16px;padding:46px 34px;text-align:center;background:var(--surface-1);transition:.15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h1{font-size:24px;margin:14px 0 6px;letter-spacing:-.2px}
.drop p{color:var(--text-secondary);margin:0 auto 22px;max-width:560px}
.drop .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drop .fmt{margin-top:26px;font-size:12.5px;color:var(--text-muted)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:760px;margin:18px auto 40px}
.features div{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--text-secondary)}
.features b{display:block;color:var(--text-primary);margin-bottom:3px;font-size:13.5px}
.progress{height:4px;background:var(--surface-3);border-radius:4px;overflow:hidden;margin:18px auto 0;max-width:360px;display:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.err{color:var(--crit);margin-top:14px;font-size:13px}
/* ---------- cards / grids ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .v{font-size:24px;font-weight:600;font-family:var(--mono);letter-spacing:-.5px;line-height:1.15}
.kpi .l{color:var(--text-muted);font-size:12px;margin-top:3px}
.two{grid-template-columns:1fr 1fr}
.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:1000px){.two,.three,.features{grid-template-columns:1fr}}
.sevrow{display:flex;gap:8px;flex-wrap:wrap}
.sevpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;cursor:pointer;background:var(--surface-2)}
.sevpill:hover{border-color:var(--border-strong)}
.sevpill b{font-family:var(--mono)}
/* hbar list */
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;align-items:center;gap:10px;font-size:12.5px;cursor:default}
.hb.click{cursor:pointer}
.hb.click:hover .lab{color:var(--accent)}
.hb .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);color:var(--text-primary)}
.hb .track{height:10px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.hb .fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hb .num{font-family:var(--mono);color:var(--text-secondary);text-align:right;min-width:64px}
/* chart */
.chartwrap{position:relative}
canvas.timeline{width:100%;height:190px;display:block}
.tip{position:fixed;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;font-size:12px;z-index:100;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:340px}
.tip .t{color:var(--text-muted);font-family:var(--mono);font-size:11px;margin-bottom:2px}
.tip b{font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--text-secondary);text-transform:none;letter-spacing:0}
.seg button.on{background:var(--surface-3);color:var(--text-primary)}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--text-secondary);padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;font-size:12px}
.tbl th:hover{color:var(--text-primary)}
.tbl th.num,.tbl td.num{text-align:right}
.tbl td{padding:5px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);white-space:nowrap;max-width:420px;overflow:hidden;text-overflow:ellipsis}
.tbl tr:hover td{background:var(--surface-2)}
.tbl tr.click{cursor:pointer}
.tablebox{border:1px solid var(--border);border-radius:12px;overflow:auto;max-height:calc(100vh - 220px);background:var(--surface-1)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.search{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:7px;padding:6px 10px;min-width:260px;font-family:var(--mono);font-size:12.5px}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.muted{color:var(--text-muted)}
.sub{color:var(--text-secondary);font-size:13px}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-family:var(--mono);background:var(--surface-3);color:var(--text-secondary);line-height:18px}
.tag.bad{background:var(--row-err);color:var(--crit)}
.tag.warn{background:var(--row-warn);color:var(--med)}
.tag.ok{background:var(--row-icmp);color:var(--series-3)}
/* severity badges */
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px 2px 6px;border-radius:5px;border:1px solid currentColor;white-space:nowrap}
.sev svg{width:11px;height:11px}
.sev.critical{color:var(--crit)} .sev.high{color:var(--high)} .sev.medium{color:var(--med)} .sev.low{color:var(--low)} .sev.info{color:var(--info)}
/* findings */
.finding{background:var(--surface-1);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:10px;padding:13px 16px;margin-bottom:10px}
.finding.critical{border-left-color:var(--crit)} .finding.high{border-left-color:var(--high)} .finding.medium{border-left-color:var(--med)} .finding.low{border-left-color:var(--low)}
.finding .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.finding .ti{font-weight:600;font-size:14.5px}
.finding .cat{font-size:11.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.finding .ds{color:var(--text-secondary);margin:6px 0 8px;font-size:13px}
.finding ul{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:12px;color:var(--text-primary)}
.finding li{padding:2px 0;border-top:1px dashed var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.finding li:first-child{border-top:0}
.finding .ft{display:flex;gap:8px;margin-top:10px;align-items:center}
.finding .why{font-size:12.5px;color:var(--text-secondary);margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:7px}
.finding .why b{color:var(--text-primary)}
.empty{padding:40px;text-align:center;color:var(--text-muted)}
/* ---------- packets view ---------- */
.pkview{display:grid;grid-template-rows:auto minmax(160px,1fr) 6px var(--detail-h,300px);height:calc(100vh - 96px)}
.filterbar{display:flex;gap:8px;align-items:center;padding:9px 14px;background:var(--surface-1);border-bottom:1px solid var(--border);flex-wrap:wrap}
.filterbar .fin{flex:1;min-width:280px;position:relative}
.filterbar input{width:100%;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:7px;padding:6px 10px 6px 30px;font-family:var(--mono);font-size:12.5px}
.filterbar input.bad{border-color:var(--crit);background:var(--row-err)}
.filterbar input.good{border-color:var(--series-3)}
.filterbar .fin svg{position:absolute;left:9px;top:8px;color:var(--text-muted)}
.ferr{font-size:12px;color:var(--crit);font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--text-primary);border:1px solid var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:12px}
.chip button{border:0;background:transparent;cursor:pointer;padding:0 5px;color:var(--text-secondary)}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.quick button{border:1px solid var(--border);background:transparent;border-radius:5px;font-size:11.5px;padding:2px 7px;cursor:pointer;font-family:var(--mono);color:var(--text-secondary)}
.quick button:hover{color:var(--text-primary);border-color:var(--border-strong)}
.plist{position:relative;overflow:auto;background:var(--surface-1);outline:none}
.prow,.phead{display:grid;grid-template-columns:var(--cols);font-family:var(--mono);font-size:12px;white-space:nowrap}
.phead{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--border);font-family:var(--sans);font-weight:600;color:var(--text-secondary);font-size:12px}
.phead div{padding:6px 8px}
.prow{position:absolute;left:0;right:0;height:24px;line-height:24px;cursor:default;border-bottom:1px solid transparent}
.prow div{padding:0 8px;overflow:hidden;text-overflow:ellipsis}
.prow:hover{filter:brightness(1.15)}
.prow.err{background:var(--row-err)} .prow.warn{background:var(--row-warn)} .prow.dns{background:var(--row-dns)} .prow.arp{background:var(--row-arp)} .prow.ctl{background:var(--row-ctl)} .prow.icmp{background:var(--row-icmp)}
.prow.sel{background:var(--sel)!important;color:var(--text-primary)}
:root[data-theme="light"] .prow.sel{color:#0b0b0b}
.prow .num{text-align:right}
.splitter{background:var(--border);cursor:row-resize}
.splitter:hover{background:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(320px,1.1fr) minmax(300px,1fr);min-height:0;background:var(--surface-1)}
.tree{overflow:auto;border-right:1px solid var(--border);padding:8px 0;font-family:var(--mono);font-size:12px}
.tree details{padding:0}
.tree summary{padding:3px 12px;cursor:pointer;list-style:none;display:flex;gap:6px;align-items:center}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:'▸';color:var(--text-muted);width:10px;display:inline-block;transition:transform .1s}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover,.tree .fld:hover{background:var(--surface-2)}
.tree summary.on{background:var(--accent-soft)}
.tree .fld{padding:2px 12px 2px 38px;display:flex;gap:8px;align-items:baseline}
.tree .fld .k{color:var(--text-secondary)}
.tree .fld .vv{color:var(--text-primary);word-break:break-all}
.tree .fld .af{margin-left:auto;opacity:0;border:0;background:var(--surface-3);border-radius:4px;font-size:10.5px;cursor:pointer;padding:0 6px;color:var(--text-secondary);flex:none}
.tree .fld:hover .af{opacity:1}
.tree .acts{display:flex;gap:6px;padding:4px 12px 10px;flex-wrap:wrap}
.hex{overflow:auto;padding:8px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre;color:var(--text-secondary)}
.hex .o{color:var(--text-muted)}
.hex .h{background:var(--accent-soft);color:var(--text-primary);border-radius:2px}
.nosel{display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;grid-column:1/-1}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.modal .box{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:14px;width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal .mh b{flex:1;font-family:var(--mono);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .mb{overflow:auto;padding:14px 16px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;line-height:1.5}
.modal .mf{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--text-secondary)}
.c2s{color:var(--series-8)} .s2c{color:var(--series-1)}
.modal .help{white-space:normal;font-family:var(--sans);font-size:13px}
.help code{font-family:var(--mono);font-size:12px;background:var(--surface-3);padding:1px 5px;border-radius:4px}
.help table{border-collapse:collapse;width:100%;margin:6px 0 14px}
.help td{border-bottom:1px solid var(--border);padding:5px 8px;vertical-align:top}
.help td:first-child{font-family:var(--mono);font-size:12px;white-space:nowrap;color:var(--text-primary)}
.help h4{margin:14px 0 4px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border-strong);padding:8px 14px;border-radius:8px;font-size:13px;z-index:200;display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--text-muted)}
.kv div:nth-child(even){font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptree{font-family:var(--mono);font-size:12.5px}
.ptree .pr{display:grid;grid-template-columns:minmax(200px,40%) 1fr 90px 100px;gap:10px;align-items:center;padding:4px 6px;border-radius:5px;cursor:pointer}
.ptree .pr:hover{background:var(--surface-2)}
.ptree .pr .track{height:10px;background:var(--surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.ptree .pr .fill{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.ptree .hdr{font-family:var(--sans);font-weight:600;color:var(--text-secondary);font-size:12px;cursor:default}
.ptree .hdr:hover{background:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" fill="var(--accent)"/><path d="M5 15h3l2-6 3 9 2-5h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    PacketLens <small>capture analyzer</small>
  </div>
  <div class="fileinfo" id="fileinfo"></div>
  <input type="file" id="fileinput" accept=".pcap,.pcapng,.cap,.dmp,.gz,.pcap.gz,.ntar" hidden>
  <button class="btn" id="openbtn">Open capture</button>
  <button class="btn ghost" id="themebtn" title="Toggle light/dark" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
</header>
<nav class="tabs" id="tabs" hidden></nav>
<main id="main"></main>
<div class="tip" id="tip"></div>
<div class="modal" id="modal"><div class="box"><div class="mh"><b id="mtitle"></b><span id="mtools"></span><button class="btn sm" id="mclose">Close</button></div><div class="mb" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = n => (n ?? 0).toLocaleString('en-US');
function fmtBytes(b){ if(b<1024) return b+' B'; const u=['KB','MB','GB','TB']; let i=-1; do{b/=1024;i++}while(b>=1024&&i<3); return b.toFixed(b<10?2:b<100?1:0)+' '+u[i]; }
function fmtDur(s){ if(s<1) return (s*1000).toFixed(s<0.01?2:0)+' ms'; if(s<60) return s.toFixed(2)+' s'; if(s<3600) return Math.floor(s/60)+'m '+Math.round(s%60)+'s'; return Math.floor(s/3600)+'h '+Math.round(s%3600/60)+'m'; }
function fmtTs(t){ const d=new Date(t*1000); const us=Math.round((t%1)*1e6)%1e6; return d.toISOString().replace('T',' ').slice(0,19)+'.'+String(us).padStart(6,'0'); }
const hex2 = b => b.toString(16).padStart(2,'0');
const hexN = (n,w) => '0x'+n.toString(16).padStart(w,'0');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',2200); }

/* ---------------- MD5 (for JA3) ---------------- */
function md5(str){
  const r=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const k=md5.k||(md5.k=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*4294967296)|0));
  const bytes=new TextEncoder().encode(str), n=bytes.length;
  const words=new Int32Array((((n+8)>>6)+1)*16);
  for(let i=0;i<n;i++) words[i>>2]|=bytes[i]<<((i%4)*8);
  words[n>>2]|=0x80<<((n%4)*8); words[words.length-2]=n*8;
  let h0=0x67452301,h1=0xefcdab89|0,h2=0x98badcfe|0,h3=0x10325476;
  for(let i=0;i<words.length;i+=16){
    let a=h0,b=h1,c=h2,d=h3;
    for(let j=0;j<64;j++){
      let f,g;
      if(j<16){f=(b&c)|(~b&d);g=j}else if(j<32){f=(d&b)|(~d&c);g=(5*j+1)%16}else if(j<48){f=b^c^d;g=(3*j+5)%16}else{f=c^(b|~d);g=(7*j)%16}
      const tmp=d; d=c; c=b; const x=(((a+f)|0)+((k[j]+words[i+g])|0))|0;
      b=(b+((x<<r[j])|(x>>>(32-r[j]))))|0; a=tmp;
    }
    h0=(h0+a)|0;h1=(h1+b)|0;h2=(h2+c)|0;h3=(h3+d)|0;
  }
  return [h0,h1,h2,h3].map(h=>{let s='';for(let i=0;i<4;i++)s+=hex2((h>>>(i*8))&255);return s}).join('');
}

/* =====================================================================
   1. CAPTURE FILE PARSING (pcap + pcapng)
   ===================================================================== */
const LINKTYPES={0:'BSD loopback',1:'Ethernet',101:'Raw IP',108:'OpenBSD loopback',113:'Linux cooked (SLL)',105:'IEEE 802.11',127:'802.11 radiotap',228:'Raw IPv4',229:'Raw IPv6',276:'Linux cooked v2 (SLL2)',12:'Raw IP',14:'Raw IP'};

function parseCapture(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  if(buf.byteLength<24) throw new Error('File is too small to be a capture.');
  const m=dv.getUint32(0,false);
  if(m===0x0A0D0D0A) return parsePcapng(dv,u8);
  let le, nano;
  if(m===0xa1b2c3d4){le=false;nano=false}else if(m===0xd4c3b2a1){le=true;nano=false}
  else if(m===0xa1b23c4d){le=false;nano=true}else if(m===0x4d3cb2a1){le=true;nano=true}
  else throw new Error('Unrecognised file format (magic 0x'+m.toString(16)+'). Expected pcap or pcapng.');
  const vmaj=dv.getUint16(4,le), vmin=dv.getUint16(6,le), snap=dv.getUint32(16,le), lt=dv.getUint32(20,le)&0xffff;
  const packets=[]; let off=24; const div=nano?1e9:1e6; let truncated=false;
  while(off+16<=buf.byteLength){
    const sec=dv.getUint32(off,le), frac=dv.getUint32(off+4,le), cap=dv.getUint32(off+8,le), len=dv.getUint32(off+12,le);
    off+=16;
    if(cap>262144*4 || off+cap>buf.byteLength){ truncated=true; break; }
    packets.push({ts:sec+frac/div, caplen:cap, len, iface:0, lt, data:u8.subarray(off,off+cap)});
    off+=cap;
  }

function tcpAnalyze(p,st,fromC){

  if(t.rst){ st.rsts++; st.rstBy ??= fromC?'client':'server'; st.rstNo ??= p.no; st.rstTs ??= p.ts; }

  if(me.isn===undefined) me.isn = t.syn ? t.seq : (t.seq-1)>>>0;
  const segLen = t.plen + (t.syn?1:0) + (t.fin?1:0);
  if(t.plen>0) st.dataP++; if(segLen>0) st.segP=(st.segP||0)+1;
  if(me.next!==undefined && !t.syn && !t.rst){
    if(segLen>0){
      if(t.plen<=1 && t.seq===((me.next-1)>>>0) && !t.fin) an.ka=true;
      else if(t.plen===1 && t.seq===me.next && peer.win===0) an.zwp=true;
      else if(seqLT(t.seq, me.next)) { an.retrans=true; st.retrans++; }

function rowClass(p){
  if(p.malformed) return 'err';
  if(p.tcp){ if(p.tcp.rst||p.tcp.an?.retrans||p.tcp.an?.zwin) return 'err'; if(p.tcp.an?.dupack||p.tcp.an?.zwp) return 'warn'; if(p.tcp.syn||p.tcp.fin) return 'ctl'; }

  if(p.arp) return 'arp';
  if(p.http && !p.http.req && p.http.code>=400) return 'warn';
  return '';

function credCheck(S,p){

    } }

function hexDump(d,s,e){
  let out=''; const n=Math.min(d.length,65536);
  for(let o=0;o<n;o+=16){
    let hx='', as='';
    for(let i=0;i<16;i++){ const k=o+i; if(k<n){ const b=d[k]; const inR=k>=s&&k<e; const ch=(b>=32&&b<127)?esc(String.fromCharCode(b)):'.';
        hx+=(inR?'<span class="h">':'')+hex2(b)+(inR?'</span>':'')+(i===7?'  ':' '); as+=(inR?'<span class="h">':'')+ch+(inR?'</span>':''); }
      else { hx+='   '+(i===7?' ':''); } }
    out+=`<span class="o">${o.toString(16).padStart(4,'0')}</span>  ${hx} ${as}\n`;
  }
  if(d.length>n) out+='… truncated display';
  return out;
}

/* ---------- Follow stream ---------- */
function followStream(id){
  const st=S.streams[id]; const pk=st.pk.map(n=>S.packets[n-1]);
  const segs=[]; for(const p of pk){ if(p.tcp?.an?.retrans) continue; const pl=p.tcp?{s:p.tcp.ps,e:p.tcp.pe}:p.udp?{s:p.udp.ps,e:p.udp.pe}:null; if(!pl||pl.e<=pl.s) continue; const last=segs[segs.length-1]; if(last&&last.c===p.fromC) last.parts.push(p.data.subarray(pl.s,pl.e)); else segs.push({c:p.fromC,parts:[p.data.subarray(pl.s,pl.e)],no:p.no}); }
  const render=mode=>{ $('#mbody').innerHTML = segs.length? segs.map(s=>{ const tot=s.parts.reduce((a,b)=>a+b.length,0); const buf=new Uint8Array(Math.min(tot,200000)); let o=0; for(const x of s.parts){ if(o>=buf.length)break; buf.set(x.subarray(0,buf.length-o),o); o+=x.length; }
      const body = mode==='hex' ? hexDump(buf,-1,-1) : esc(printable(buf,0,buf.length));
      return `<div class="${s.c?'c2s':'s2c'}" style="margin-bottom:8px">${body}${tot>buf.length?'\n… ('+fmtBytes(tot)+' total)':''}</div>`; }).join('') : '<div class="muted">This stream carries no payload.</div>'; };
  const dur=st.last-st.first;
  openModal(`${st.l4.toUpperCase()} stream ${id}: ${st.cA}:${st.cP} ⇄ ${st.sA}:${st.sP}`, '', `<span class="c2s">■ ${esc(st.cA)}:${st.cP} → ${fmtBytes(st.csB)}</span><span class="s2c">■ ${esc(st.sA)}:${st.sP} → ${fmtBytes(st.scB)}</span><span>${fmtN(st.pk.length)} packets · ${fmtDur(dur)}${st.app?' · '+esc(st.app):''}</span><span style="flex:1"></span><button class="btn sm" id="fs-filter">Filter this stream</button>`, `<span class="seg" id="fsmode"><button data-m="ascii" class="on">ASCII</button><button data-m="hex">Hex</button></span>`);
  render('ascii');
  $('#fsmode').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#fsmode').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); render(b.dataset.m); });
  $('#fs-filter').onclick=()=>{ closeModal(); applyFilter(`${st.l4}.stream==${id}`); };
}

/* ---------- Generic sortable table ---------- */
function table(key,cols,rows,opts={}){
  const s=UI.sort[key]||{c:opts.sortCol??0,d:opts.sortDir??-1};
  const q=(UI['q_'+key]||'').toLowerCase();
  let r=rows; if(q) r=r.filter(x=>cols.some(c=>String(c.v(x)).toLowerCase().includes(q)));
  const col=cols[s.c]; r=[...r].sort((a,b)=>{ const A=col.sv?col.sv(a):col.v(a), B=col.sv?col.sv(b):col.v(b); return (A>B?1:A<B?-1:0)*s.d; });
  const shown=r.slice(0,opts.limit||2000);
  const html=`<div class="toolbar"><input class="search" id="q_${key}" placeholder="Search…" value="${esc(UI['q_'+key]||'')}"><span class="sub">${fmtN(r.length)} row${r.length===1?'':'s'}${r.length>shown.length?' (showing first '+fmtN(shown.length)+')':''}</span><span class="grow"></span>${opts.tools||''}<button class="btn sm" id="csv_${key}">Copy CSV</button></div>
  <div class="tablebox"><table class="tbl"><thead><tr>${cols.map((c,i)=>`<th data-c="${i}" class="${c.num?'num':''}">${esc(c.h)}${s.c===i?(s.d>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>
  ${shown.map((x,i)=>`<tr class="${opts.onRow?'click':''}" data-i="${i}">${cols.map(c=>`<td class="${c.num?'num':''}" title="${esc(c.v(x))}">${c.html?c.html(x):esc(c.f?c.f(x):c.v(x))}</td>`).join('')}</tr>`).join('')}</tbody></table>${shown.length?'':'<div class="empty">Nothing here.</div>'}</div>`;
  return {html, bind:(root)=>{
    root.querySelectorAll('th').forEach(th=>th.onclick=()=>{ const c=+th.dataset.c; UI.sort[key]={c,d:s.c===c?-s.d:(cols[c].num?-1:1)}; renderTab(); });
    const qi=root.querySelector('#q_'+key); qi.oninput=()=>{ UI['q_'+key]=qi.value; clearTimeout(qi._t); qi._t=setTimeout(()=>{ renderTab(); const n=$('#q_'+key); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },200); };
    root.querySelector('#csv_'+key).onclick=()=>copyText([cols.map(c=>c.h).join(','),...r.map(x=>cols.map(c=>'"'+String(c.f?c.f(x):c.v(x)).replace(/"/g,'""')+'"').join(','))].join('\n'),'CSV copied to clipboard');
    if(opts.onRow) root.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=e=>{ if(e.target.closest('button,a')) return; opts.onRow(shown[+tr.dataset.i]); });
  }};
}

function sessState(s){
  if(s.l4==='udp') return s.scP?'bidirectional':'one-way';
  let st;
  if(s.synTs!=null && s.synAckTs==null) st = s.rstBy==='server'?'refused':'no answer';
  else if(s.rsts) st='reset by '+(s.rstBy||'?');
  else if(s.finSeen) st='closed';
  else if(s.synAckTs!=null) st='established';
  else st='mid-stream';
  if(s.retrans) st+=` · ${s.retrans} retrans`; if(s.zwin) st+=' · zero win';
  return st;
}
function renderEndpoints(){
  const t=table('eps',[
    {h:'Address',v:x=>x.ip},{h:'Scope',v:x=>isMulti(x.ip)?'multicast/bcast':isPrivate(x.ip)?'private':'public',html:x=>`<span class="tag ${isPrivate(x.ip)?'':'warn'}">${isMulti(x.ip)?'multicast':isPrivate(x.ip)?'private':'public'}</span>`},
    {h:'Names seen',v:x=>[...x.names].slice(0,3).join(', ')},{h:'MAC(s)',v:x=>[...x.macs].join(', ')},
    {h:'Packets',v:x=>x.txP+x.rxP,num:1,f:x=>fmtN(x.txP+x.rxP)},{h:'Tx bytes',v:x=>x.txB,num:1,f:x=>fmtBytes(x.txB)},{h:'Rx bytes',v:x=>x.rxB,num:1,f:x=>fmtBytes(x.rxB)},
    {h:'Peers',v:x=>x.peers.size,num:1},{h:'Dst ports used',v:x=>x.ports.size,num:1},{h:'TTLs',v:x=>[...x.ttl].sort((a,b)=>a-b).join(',')},{h:'First (rel)',v:x=>x.first-S.t0,num:1,f:x=>(x.first-S.t0).toFixed(3)}],
    S.eps,{sortCol:4,onRow:x=>applyFilter('ip.addr=='+x.ip)});
  mountTable(t);
}
function renderProtocols(){
  const total=S.packets.length; let rows=[];
  const walk=(m,depth,path)=>{ [...m].sort((a,b)=>b[1].p-a[1].p).forEach(([k,n])=>{ rows.push({k,depth,n,path:[...path,k]}); walk(n.c,depth+1,[...path,k]); }); };
  walk(S.hier,0,[]);
  $('#main').innerHTML=`<div class="card"><h3>Protocol hierarchy</h3><div class="ptree"><div class="pr hdr"><div>Protocol</div><div>% of packets</div><div style="text-align:right">Packets</div><div style="text-align:right">Bytes</div></div>
    ${rows.map((r,i)=>`<div class="pr" data-i="${i}"><div style="padding-left:${r.depth*16}px">${esc(r.k)}</div><div style="display:flex;align-items:center;gap:8px"><div class="track" style="flex:1"><div class="fill" style="width:${(r.n.p/total*100).toFixed(2)}%"></div></div><span class="muted" style="width:52px;text-align:right">${(r.n.p/total*100).toFixed(1)}%</span></div><div style="text-align:right">${fmtN(r.n.p)}</div><div style="text-align:right">${fmtBytes(r.n.b)}</div></div>`).join('')}</div>
    <div class="sub" style="margin-top:8px;font-size:12px">Click a protocol to filter packets.</div></div>`;
  $('#main').querySelectorAll('.pr[data-i]').forEach(el=>el.onclick=()=>{ const r=rows[+el.dataset.i]; applyFilter(r.k==='frame'?'':r.k); });
}
function renderDNS(){
  const t=table('dns',[
    {h:'No.',v:x=>x.no,num:1},{h:'Time (rel)',v:x=>x.ts-S.t0,num:1,f:x=>(x.ts-S.t0).toFixed(3)},{h:'Client',v:x=>x.client},{h:'Server',v:x=>x.server},{h:'Query',v:x=>x.name},{h:'Type',v:x=>DNS_T[x.type]||x.type||''},
    {h:'Result',v:x=>x.rcode===null?'no response':DNS_RC[x.rcode]||x.rcode,html:x=>`<span class="tag ${x.rcode===null||x.rcode>0?'bad':'ok'}">${esc(x.rcode===null?'no response':DNS_RC[x.rcode]||x.rcode)}</span>`},
    {h:'Answers',v:x=>x.answers.join(', ')},{h:'Resp. time',v:x=>x.rt??-1,num:1,f:x=>x.rt!=null?fmtDur(x.rt):''}],
    S.dnsTx,{sortCol:0,sortDir:1,onRow:x=>applyFilter(`dns.qry.name=="${x.name}"`)});
  const uniq=new Map(); S.dnsTx.forEach(t=>uniq.set(t.name,(uniq.get(t.name)||0)+1));
  const top=[...uniq].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v])=>({l,v}));
  mountTable(t,`<div class="card" style="margin-bottom:14px" id="dnstop"><h3>Most queried names</h3>${hbars(top,0,1)}</div>`);
  bindBars($('#dnstop'),top,r=>applyFilter(`dns.qry.name=="${r.l}"`));
}
function renderHTTP(){
  mountTable(table('http',[
    {h:'No.',v:x=>x.no,num:1},{h:'Time (rel)',v:x=>x.ts-S.t0,num:1,f:x=>(x.ts-S.t0).toFixed(3)},{h:'Client',v:x=>x.client},{h:'Method',v:x=>x.method},{h:'Host',v:x=>x.host},{h:'URI',v:x=>x.uri},
    {h:'Status',v:x=>x.code??0,num:1,html:x=>x.code==null?'<span class="muted">—</span>':`<span class="tag ${x.code>=400?'bad':x.code>=300?'warn':'ok'}">${x.code}</span>`},{h:'Content-Type',v:x=>x.ctype||''},{h:'User-Agent',v:x=>x.ua},{h:'Server',v:x=>x.server_sw||''},{h:'Resp. time',v:x=>x.rt??-1,num:1,f:x=>x.rt!=null?fmtDur(x.rt):''}],
    S.httpTx,{sortCol:0,sortDir:1,onRow:x=>followStream(x.stream)}));
}
function renderTLS(){
  const ja3c=new Map(); S.tlsTx.forEach(t=>ja3c.set(t.ja3,(ja3c.get(t.ja3)||0)+1));
  mountTable(table('tls',[
    {h:'No.',v:x=>x.no,num:1},{h:'Time (rel)',v:x=>x.ts-S.t0,num:1,f:x=>(x.ts-S.t0).toFixed(3)},{h:'Client',v:x=>x.client},{h:'Server',v:x=>x.server+':'+x.port},{h:'SNI',v:x=>x.sni||'(none)'},
    {h:'Offered',v:x=>TLS_V[x.ver]||x.ver},{h:'Negotiated',v:x=>x.neg?TLS_V[x.neg]||x.neg:'',html:x=>x.neg?`<span class="tag ${x.neg<0x0303?'bad':'ok'}">${esc(TLS_V[x.neg]||x.neg)}</span>`:'<span class="muted">—</span>'},
    {h:'ALPN',v:x=>x.alpn},{h:'JA3',v:x=>x.ja3},{h:'JA3 seen',v:x=>ja3c.get(x.ja3),num:1}],
    S.tlsTx,{sortCol:0,sortDir:1,onRow:x=>applyFilter(`tcp.stream==${x.stream}`)}),
    `<div class="sub" style="margin-bottom:10px">JA3 fingerprints identify the TLS client software. Search a JA3 hash in threat-intel feeds (e.g. abuse.ch SSLBL, ja3er) to spot known malware clients.</div>`);
}
function renderCreds(){
  UI.reveal ??= false;
  const mask=s=>!s?'':UI.reveal?s:(s.length>2?s[0]+'•'.repeat(Math.min(10,s.length-2))+s[s.length-1]:'••');
  mountTable(table('creds',[
    {h:'No.',v:x=>x.no,num:1},{h:'Time (rel)',v:x=>x.ts-S.t0,num:1,f:x=>(x.ts-S.t0).toFixed(3)},{h:'Protocol',v:x=>x.proto},{h:'Client',v:x=>x.src},{h:'Server',v:x=>x.dst+':'+x.dport},{h:'Username',v:x=>x.user},{h:'Secret',v:x=>mask(x.secret)},{h:'Detail',v:x=>x.detail}],
    S.creds,{sortCol:0,sortDir:1,tools:`<button class="btn sm" id="reveal">${UI.reveal?'Hide':'Reveal'} secrets</button>`,onRow:x=>applyFilter('frame.number=='+x.no)}),
    `<div class="sub" style="margin-bottom:10px">Credentials and community strings transmitted without encryption (HTTP Basic/forms, FTP, POP3, IMAP, SMTP AUTH PLAIN, SNMPv1/v2c).</div>`);
  $('#reveal').onclick=()=>{UI.reveal=!UI.reveal;renderCreds()};
}

renderLanding();
</script>
